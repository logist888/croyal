# One-click-ish deploy to Render (gives a permanent https URL for the Mini App).
# Connect this repo in the Render dashboard; it reads this file.
services:
  - type: web
    name: tower-clash
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace client
    startCommand: npm run start --workspace server
    envVars:
      # LAUNCH: verified Telegram auth only (dev auth OFF). Requires BOT_TOKEN
      # below to be set; if BOT_TOKEN is empty the server safely falls back to
      # dev auth (no login lockout). For local browser testing, override this
      # to "1" in your own env — never in production.
      - key: ALLOW_DEV_AUTH
        value: "0"
      # @BotFather token → verified Telegram auth. Paste the value in the
      # Render dashboard (Environment); the key is pre-declared here.
      - key: BOT_TOKEN
        sync: false
      # Durable storage so progress survives restarts/sleep. Paste your Neon/Supabase
      # connection string in the Render dashboard (Environment).
      - key: DATABASE_URL
        sync: false
      # Optional: keep the free instance warm — set to this app's public
      # health URL, e.g. https://<app>.onrender.com/api/health
      - key: KEEPALIVE_URL
        sync: false
      # Telegram Stars payments (gems). OFF by default — flip to "1" only AFTER
      # wiring the bot webhook and testing a purchase (see docs/PAYMENTS.md).
      - key: STARS_ENABLED
        value: "0"
      # Optional shared secret for the Telegram webhook (setWebhook secret_token).
      # Paste the value in the Render dashboard (Environment).
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
