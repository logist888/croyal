<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values, which the layout needs on notched phones and in fullscreen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tower Clash</title>
    <link rel="icon" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Self-hosted Rubik (see scripts/fetch-fonts.mjs). Preloading the Latin
         cut avoids a flash of fallback text on the first screen; the Cyrillic
         cut is fetched on demand via unicode-range, so EN users never pay it. -->
    <link rel="preload" href="./fonts/rubik-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="ui"></div>
      <div id="game"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
